name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (lint + typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Build
        run: npm run build

  ai:
    name: AI capability (lint + smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/ai/requirements.txt
      - name: Install dependencies
        run: pip install -r services/ai/requirements.txt ruff
      - name: Lint
        run: ruff check services/ai
      - name: Byte-compile + import smoke test
        run: |
          python -m compileall services/ai/main.py
          cd services/ai && python -c "import main"

  identity:
    name: Identity capability tests (T2.x)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: careerpilot
          POSTGRES_PASSWORD: careerpilot-ci
          POSTGRES_DB: careerpilot
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U careerpilot"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint + typecheck
        run: |
          npm run lint
          npm run typecheck
      - name: Run identity integration tests
        env:
          PGHOST: localhost
          PGPORT: 5433
          PGUSER: careerpilot
          CI_TEST_PASSWORD: careerpilot-ci
        run: npx vitest run

  stack-tests:
    name: Compose validation + schema tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate local-only dev secrets (required by compose config)
        run: bash scripts/dev-secrets.sh
      - name: Validate Compose files
        run: |
          docker compose -f compose.yaml config -q
          docker compose -f compose.yaml -f compose.prod.yaml config -q
      - name: Apply migrations and run schema tests
        run: bash scripts/test-schema.sh
