name: CI

on:
  push:
    branches: [main]
  pull_request:

# L7: least privilege by default; jobs that need more declare it themselves.
permissions:
  contents: read

# L7: superseded runs on the same ref cancel instead of burning minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    name: Backend (lint + typecheck + build + audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Precompile (L6 prod gate — images run `node dist`, never tsx JIT)
        run: npm run build
      - name: Dependency audit (blocking — prod tree is currently clean)
        run: npm audit --omit=dev --audit-level=moderate

  frontend:
    name: Frontend (lint + build + audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Tests (M12/H14 helper suites)
        run: npm test
      - name: Build
        run: npm run build

      - name: Dependency audit (advisory — next@15 carries postcss/sharp HIGHs; fix rides the next@16 Dependabot PR)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

  ai:
    name: AI capability (lint + smoke + audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/ai/requirements.txt
            services/ai/requirements.lock
      - name: Install dependencies
        # O5: prod deps from the hashed lock; test/lint tools on top.
        run: |
          pip install --require-hashes -r services/ai/requirements.lock
          pip install -r services/ai/requirements.txt ruff pytest httpx pip-audit
      - name: Lint
        run: ruff check services/ai
      - name: Tests (extract caller auth)
        run: python -m pytest services/ai -q
      - name: Byte-compile + import smoke test
        run: |
          python -m compileall services/ai/main.py
          cd services/ai && python -c "import main"
      - name: Dependency audit (advisory — starlette 0.46.2 carries PYSEC items; fix needs a fastapi minor bump, tracked separately)
        continue-on-error: true
        run: pip-audit -r services/ai/requirements.txt

  backend-tests:
    # L7: renamed from `identity` — this job runs the whole backend suite,
    # not just identity tests.
    name: Backend integration tests (full suite)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/backend
    services:
      postgres:
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_USER: careerpilot
          POSTGRES_PASSWORD: careerpilot-ci
          POSTGRES_DB: careerpilot
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U careerpilot"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint + typecheck
        run: |
          npm run lint
          npm run typecheck
      - name: Run backend integration tests
        env:
          PGHOST: localhost
          PGPORT: 5433
          PGUSER: careerpilot
          CI_TEST_PASSWORD: careerpilot-ci
        run: npx vitest run

  stack-tests:
    name: Compose validation + schema tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Generate local-only dev secrets (required by compose config)
        run: bash scripts/dev-secrets.sh
      - name: Validate Compose files
        run: |
          docker compose -f compose.yaml config -q
          docker compose -f compose.yaml -f compose.prod.yaml config -q
      - name: Apply migrations and run schema tests
        run: bash scripts/test-schema.sh
      - name: Backup pipeline + restore drill with deletion replay (T8.3/T8.4)
        run: bash scripts/test-backup.sh
      - name: Ops-path tests — vault fetch, health-check dry-run, upload round-trip, retention, flock (L8)
        run: bash scripts/test-ops.sh

  images:
    # L7: CI builds the actual prod images and scans them. The scan is
    # report-only (SARIF to code scanning): base images currently carry
    # upstream findings outside our control (npm-bundled tar in
    # node:22-alpine, debian packages in python:3.12-slim), so a blocking
    # gate would be permanently red. App-layer deps are gated by the
    # blocking npm-audit step instead.
    name: Prod image builds + scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Generate local-only dev secrets (required by compose config)
        run: bash scripts/dev-secrets.sh
      - name: Build prod images
        run: |
          docker build -f apps/backend/Dockerfile -t careerpilot-backend:ci .
          docker build -f apps/frontend/Dockerfile -t careerpilot-frontend:ci ./apps/frontend
          docker build -f services/ai/Dockerfile -t careerpilot-ai:ci ./services/ai
      - name: Smoke-boot backend image (precompiled dist, no tsx)
        run: docker run --rm careerpilot-backend:ci sh -c "test -f dist/server.js && test ! -e node_modules/.bin/tsx && echo dist-ok"
      - name: Scan images (report-only, HIGH/CRITICAL table in log)
        run: |
          mkdir -p /tmp/sarif
          for img in careerpilot-backend:ci careerpilot-frontend:ci careerpilot-ai:ci; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.65.0@sha256:a22415a38938a56c379387a8163fcb0ce38b10ace73e593475d3658d578b2436 image --severity HIGH,CRITICAL --no-progress --exit-code 0 \
              "$img"
          done
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v /tmp/sarif:/tmp/sarif aquasec/trivy:0.65.0@sha256:a22415a38938a56c379387a8163fcb0ce38b10ace73e593475d3658d578b2436 image --severity HIGH,CRITICAL --no-progress --exit-code 0 \
            --format sarif --output /tmp/sarif/trivy-backend.sarif careerpilot-backend:ci
      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: /tmp/sarif/
      - name: SBOMs (CycloneDX, O5 supply-chain evidence)
        run: |
          mkdir -p /tmp/sbom
          for img in careerpilot-backend:ci careerpilot-frontend:ci careerpilot-ai:ci; do
            name="${img%%:*}"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v /tmp/sbom:/tmp/sbom aquasec/trivy:0.65.0@sha256:a22415a38938a56c379387a8163fcb0ce38b10ace73e593475d3658d578b2436 image --no-progress --exit-code 0 \
              --format cyclonedx --output "/tmp/sbom/${name}.cdx.json" "$img"
          done
      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-sboms
          path: /tmp/sbom/
          retention-days: 30
