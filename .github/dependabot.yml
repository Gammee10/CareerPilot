# L6: keep base images and GitHub Actions fresh. Digest pins in Dockerfiles
# and compose.yaml are bumped via the PRs this generates.
version: 2
updates:
  - package-ecosystem: docker
    directory: /apps/backend
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /apps/frontend
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /services/ai
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /apps/backend
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /apps/frontend
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /services/ai
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
