# Local development overrides — automatically merged by `docker compose up`.
# Binds every debug surface to localhost only; the public contract (only
# Caddy routable, per ADR-055) is unchanged for anything not on 127.0.0.1.
services:
  caddy:
    ports: !override
      - "127.0.0.1:8080:80"

  postgres:
    ports:
      - "127.0.0.1:5433:5432"

  backend:
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      NODE_ENV: development

  frontend:
    ports:
      - "127.0.0.1:3000:3000"
